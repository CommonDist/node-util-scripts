name: Keepalive

# Scheduled workflows are disabled after 60 days without repository activity.
# A small monthly commit keeps the schedules running.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive marker
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || exit 0
          git push
