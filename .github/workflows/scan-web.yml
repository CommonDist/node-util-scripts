name: Web Scan

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      max_queries:
        description: 'Maximum number of queries to execute'
        required: false
        default: '30'
      batch_id:
        description: 'Batch identifier for this run'
        required: false

concurrency:
  group: scan-web
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GHA_BASE_URL: ${{ secrets.GHA_BASE_URL }}
      BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
      MAX_QUERIES: ${{ inputs.max_queries || '30' }}
      BATCH_ID: ${{ inputs.batch_id || github.run_id }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        id: scan
        run: |
          node - <<'SCRIPT'
          const INSTANCES = [
            'https://search.sapti.me',
            'https://searxng.site',
            'https://priv.au',
            'https://searx.tiekoetter.com',
            'https://search.bus-hit.me',
          ];

          const BASE = (process.env.GHA_BASE_URL || '').replace(/\/+$/, '');
          const TOKEN = process.env.BRIDGE_TOKEN || '';
          const MAX_Q = Math.min(Number(process.env.MAX_QUERIES || '30'), 50);
          const BATCH = process.env.BATCH_ID || `w-${Date.now()}`;

          if (!BASE || !TOKEN) { console.log('[E] 0x00'); process.exit(1); }

          async function api(method, path, body) {
            const opts = {
              method,
              headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Content-Type': 'application/json',
              },
            };
            if (body) opts.body = JSON.stringify(body);
            const r = await fetch(`${BASE}${path}`, opts);
            if (!r.ok) throw new Error(`0x${r.status.toString(16)}`);
            return method === 'GET' ? r.json() : undefined;
          }

          const PLATFORM_MAP = {
            'twitter.com': 'twitter', 'x.com': 'twitter',
            'reddit.com': 'reddit', 'old.reddit.com': 'reddit',
            'youtube.com': 'youtube', 'youtu.be': 'youtube',
            'github.com': 'github',
            'linkedin.com': 'linkedin',
            'medium.com': 'blog',
            'news.ycombinator.com': 'hackernews',
          };

          function classifyUrl(url) {
            try {
              const host = new URL(url).hostname.replace('www.', '');
              for (const [domain, platform] of Object.entries(PLATFORM_MAP)) {
                if (host === domain || host.endsWith('.' + domain)) return platform;
              }
              return 'web';
            } catch { return 'web'; }
          }

          async function searchInstance(instance, query) {
            const url = `${instance}/search?q=${encodeURIComponent(query)}&format=json&engines=google,duckduckgo,brave,bing&pageno=1`;
            const r = await fetch(url, {
              headers: {
                'Accept': 'application/json',
                'User-Agent': 'Mozilla/5.0 (compatible; WebScan/1.0)',
              },
              signal: AbortSignal.timeout(12000),
            });
            if (!r.ok) throw new Error('search failed');
            return r.json();
          }

          async function run() {
            const t0 = Date.now();

            let nouns = [];
            try {
              const resp = await api('GET', '/api/bridge/trends');
              nouns = (resp.data || []).map(n => n.noun).filter(Boolean).slice(0, MAX_Q);
            } catch { console.log('[E] 0x01'); process.exit(1); }

            if (!nouns.length) { console.log('[scan] q=0'); process.exit(0); }

            let okQ = 0, errQ = 0, items = [];

            for (const noun of nouns) {
              let found = false;
              for (const inst of INSTANCES) {
                try {
                  const data = await searchInstance(inst, noun);
                  const results = data.results || [];
                  for (const r of results.slice(0, 15)) {
                    const url = String(r.url || '').trim();
                    const title = String(r.title || '').trim();
                    if (!url || !title) continue;
                    items.push({
                      url,
                      title: title.slice(0, 500),
                      content: String(r.content || '').slice(0, 2000),
                      platform: classifyUrl(url),
                      noun,
                      batch_id: BATCH,
                      searched_at: new Date().toISOString(),
                    });
                  }
                  found = true;
                  okQ++;
                  break;
                } catch {
                  continue;
                }
              }
              if (!found) errQ++;
              await new Promise(r => setTimeout(r, 500 + Math.random() * 1000));
            }

            const seen = new Set();
            const unique = items.filter(i => {
              if (seen.has(i.url)) return false;
              seen.add(i.url);
              return true;
            });

            try {
              for (let i = 0; i < unique.length; i += 200) {
                await api('POST', '/api/bridge/push', { items: unique.slice(i, i + 200), type: 'search' });
              }
            } catch { console.log('[E] 0x03'); process.exit(1); }

            const ms = Date.now() - t0;

            await api('POST', '/api/bridge/report', {
              source: 'web-scan',
              pipeline: 'search',
              queries_total: nouns.length,
              queries_ok: okQ,
              queries_error: errQ,
              new_records: unique.length,
              duration_ms: ms,
              run_id: BATCH,
            }).catch(() => {});

            await api('POST', '/api/bridge/heartbeat', {
              source: 'web-scan',
              status: 'ok',
            }).catch(() => {});

            console.log(`[scan] q=${nouns.length} ok=${okQ} e=${errQ} n=${unique.length} ms=${ms}`);

            const { writeFileSync } = require('fs');
            const summary = [
              '## Web Scan',
              '| Metric | Value |',
              '|--------|-------|',
              `| Queries | ${nouns.length} |`,
              `| OK | ${okQ} |`,
              `| Errors | ${errQ} |`,
              `| Items | ${unique.length} |`,
              `| Duration | ${(ms / 1000).toFixed(1)}s |`,
            ].join('\n');
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath) writeFileSync(summaryPath, summary + '\n', { flag: 'a' });
          }

          run().catch(e => { console.log(`[E] 0x0F ${e.message?.slice(0,80)}`); process.exit(1); });
          SCRIPT
